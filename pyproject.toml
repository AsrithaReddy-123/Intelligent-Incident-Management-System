[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligent-incident-management-system"
version = "1.0.0"
description = "AI-powered IT incident classification, severity prediction, tracking, and recurring issue analytics."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Technical Expert", email = "technicalexpert@winaxisstaffing.com"}]
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.1",
  "email-validator>=2.1.1",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13.1",
  "python-json-logger>=2.0.7",
  "scikit-learn>=1.5.0",
  "joblib>=1.4.2",
  "pandas>=2.2.2",
  "numpy>=1.26.4",
  "prometheus-client>=0.20.0",
  "slowapi>=0.1.9",
  "python-multipart>=0.0.9"
]

[project.optional-dependencies]
bert = ["transformers>=4.41.0", "torch>=2.3.0"]
dev = ["pytest>=8.2.0", "pytest-cov>=5.0.0", "httpx>=0.27.0", "ruff>=0.4.4", "mypy>=1.10.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
addopts = "--cov=src/iims --cov-report=term-missing"
testpaths = ["tests"]
